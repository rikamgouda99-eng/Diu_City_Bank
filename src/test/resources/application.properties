# Tests run on an in-memory H2 database so they never touch the real MySQL data.
spring.application.name=Diu-City-Bank-test
spring.datasource.url=jdbc:h2:mem:dcbtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@dcb.local
spring.mail.password=unused
mail.bcc=bcc@dcb.local

app.jwt.secret=ZGl1LWNpdHktYmFuay10ZXN0LXNpZ25pbmcta2V5LWZvci1qd3QtMjU2LWJpdHM=
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=7200000

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
bank.fd.maturity-cron=-
bank.card.reminder-cron=-
logging.level.com.dcb=WARN
