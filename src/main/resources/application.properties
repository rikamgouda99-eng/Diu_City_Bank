# ---------------------------------------------------------------- banking simulation rules
# All amounts in INR. Every value here can be changed without touching code.
bank.txn.min-amount=1.00
bank.txn.max-amount=500000.00
bank.txn.mini-statement-max=10

# Fixed deposits: A = P x (1 + R / (100 x N)) ^ (N x T)
bank.fd.min-amount=1000.00
bank.fd.max-amount=10000000.00
bank.fd.min-tenure-months=6
bank.fd.max-tenure-months=120
bank.fd.compounding-per-year=4
bank.fd.min-rate=3.00
bank.fd.max-rate=9.00
bank.fd.premature-penalty-rate=1.00
bank.fd.premature-min-days=7
bank.fd.rates[0].up-to-months=12
bank.fd.rates[0].rate=6.50
bank.fd.rates[1].up-to-months=36
bank.fd.rates[1].rate=7.00
bank.fd.rates[2].up-to-months=120
bank.fd.rates[2].rate=7.25
# daily at 00:05, pays out matured FDs
bank.fd.maturity-cron=0 5 0 * * *

# Loans: EMI = P x r x (1 + r)^n / ((1 + r)^n - 1)
bank.loan.min-amount=10000.00
bank.loan.max-amount=10000000.00
bank.loan.min-tenure-months=6
bank.loan.max-tenure-months=360
bank.loan.min-rate=1.00
bank.loan.max-rate=30.00
bank.loan.rates.PERSONAL=11.50
bank.loan.rates.HOME=8.50
bank.loan.rates.EDUCATION=9.00
bank.loan.rates.VEHICLE=9.50

# Cards
bank.card.debit-daily-limit=50000.00
bank.card.max-debit-daily-limit=200000.00
bank.card.default-credit-limit=50000.00
bank.card.max-credit-limit=500000.00
bank.card.validity-years=5
bank.card.minimum-due-percent=5
bank.card.statement-day=1
bank.card.payment-due-days=20
# encrypts the full card number for the show/hide option (change it in production, existing numbers then can't be decrypted)
bank.card.pan-secret=diu-city-bank-card-number-secret-key
bank.card.otp-validity-minutes=5
# daily at 09:00, mails statement and due date reminders for credit cards with dues
bank.card.reminder-cron=0 0 9 * * *
bank.card.reminder-days-before=3

# Upload limits in bytes (2 MB photo, 5 MB KYC document)
bank.upload.photo-max-bytes=2097152
bank.upload.kyc-max-bytes=5242880

# ---------------------------------------------------------------- CORS
# frontend URLs allowed to call the API (comma separated); override with APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173

